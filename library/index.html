<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Heights Material Library</title>
<style>
:root{--bg:#121214;--card:#1c1c20;--line:#2c2c32;--tx:#ece9e3;--mut:#9a968e;--acc:#c9a46a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:24px 16px}
main{max-width:1180px;margin:0 auto}header{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
header img{height:40px}h1{font-size:19px;font-weight:600;margin:0}p.sub{color:var(--mut);margin:2px 0 0;font-size:13px}
a{color:inherit}.back{margin-left:auto;color:var(--mut);font-size:14px;text-decoration:none}.back:hover{color:var(--acc)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.bar button{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.bar button.on{border-color:var(--acc);color:var(--acc)}
.bar input{flex:1 1 180px;min-width:0;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font:inherit;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.card img{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:#000}
.card.sky img{aspect-ratio:2}
.meta{padding:8px 10px 10px}.meta b{display:block;font-size:13px;font-weight:600}
.meta code{font-size:11px;color:var(--acc);user-select:all}
.meta span{display:block;color:var(--mut);font-size:12px}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:4px;border:1px solid #0006}
.count{color:var(--mut);font-size:13px;margin-bottom:10px}
</style></head><body><main>
<header><img src="brand/heights-logo-white.png" alt="Heights Contracting"><div><h1>Material library</h1><p class="sub">Shared surfaces and skies for every project · all CC0</p></div><a class="back" href="../">← Projects</a></header>
<div class="bar" id="bar"><input id="q" type="search" placeholder="Search id or name…"></div>
<div class="count" id="count"></div>
<div class="grid" id="grid"></div>
</main>
<script>
(function(){
  var all=[],cat='all',q='';
  var grid=document.getElementById('grid'),bar=document.getElementById('bar'),count=document.getElementById('count');
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function draw(){
    var list=all.filter(function(i){return (cat==='all'||i.category===cat)&&(!q||(i.id+' '+i.name).toLowerCase().indexOf(q)>=0)});
    count.textContent=list.length+' of '+all.length+' items';
    grid.innerHTML=list.map(function(i){
      var ord=['color','normal','roughness','ao','displacement','metalness','opacity','2k','1k'];var maps=Object.keys(i.maps).sort(function(a,b){return ord.indexOf(a)-ord.indexOf(b)}).join(' · ');
      return '<div class="card'+(i.kind==='sky'?' sky':'')+'"><a href="'+esc(i.url)+'" target="_blank" rel="noopener"><img loading="lazy" src="'+esc(i.path.replace(/^library\//,''))+'preview.jpg" alt=""></a>'+
        '<div class="meta"><b>'+(i.avg?'<i class="sw" style="background:'+i.avg+'"></i>':'')+esc(i.name)+'</b><code>'+esc(i.id)+'</code>'+
        '<span>'+esc(i.category)+' · '+i.size[0]+'px · '+esc(i.source)+'</span><span>'+esc(maps)+'</span></div></div>';
    }).join('');
  }
  fetch('catalog.json').then(function(r){return r.json()}).then(function(d){
    all=d.items;
    var cats=['all'].concat(all.map(function(i){return i.category}).filter(function(c,k,a){return a.indexOf(c)===k}));
    cats.forEach(function(c){var b=document.createElement('button');b.textContent=c;if(c===cat)b.className='on';
      b.onclick=function(){cat=c;[].forEach.call(bar.querySelectorAll('button'),function(x){x.className=x===b?'on':''});draw()};bar.appendChild(b)});
    draw();
  }).catch(function(){count.textContent='Could not load catalog.json'});
  document.getElementById('q').oninput=function(e){q=e.target.value.trim().toLowerCase();draw()};
})();
</script></body></html>
