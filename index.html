<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Heights Design</title>
<style>
:root{--bg:#121214;--card:#1c1c20;--line:#2c2c32;--tx:#ece9e3;--mut:#9a968e;--acc:#c9a46a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:32px 16px}
main{max-width:860px;margin:0 auto}header{display:flex;align-items:center;gap:14px;margin-bottom:28px}
header img{height:44px}h1{font-size:20px;font-weight:600;margin:0}p.sub{color:var(--mut);margin:2px 0 0;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
a.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;color:inherit;text-decoration:none}
a.card:hover{border-color:var(--acc)}a.card b{display:block;margin-bottom:4px}a.card span{color:var(--mut);font-size:14px}
</style></head><body><main>
<header><img src="library/brand/heights-logo-white.png" alt="Heights Contracting"><div><h1>Heights Design</h1><p class="sub">3D visualisation projects</p></div></header>
<div class="grid">
<a class="card" href="outdoor-kitchen-island/"><b>Outdoor Kitchen &amp; Island</b><span>Pergola, island and back run, interactive 3D</span></a>
</div>
<h2 style="font-size:14px;font-weight:600;color:var(--mut);margin:28px 0 10px;text-transform:uppercase;letter-spacing:.06em">Resources</h2>
<div class="grid">
<a class="card" href="library/"><b>Material library</b><span>Surfaces and skies shared by all projects</span></a>
</div>
</main></body></html>
