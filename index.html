<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Heights Design</title>
<style>
:root{--bg:#121214;--card:#1c1c20;--line:#2c2c32;--tx:#ece9e3;--mut:#9a968e;--acc:#c9a46a;--err:#e07a6a}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{padding:32px 16px}main{max-width:860px;margin:0 auto}
header{display:flex;align-items:center;gap:14px;margin-bottom:28px;flex-wrap:wrap}header img{height:44px}
h1{font-size:20px;font-weight:600;margin:0}p.sub{color:var(--mut);margin:2px 0 0;font-size:14px}
.tools{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
button,.btn{font:inherit;font-size:14px;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer}
button:hover{border-color:var(--acc)}button.pri{background:var(--acc);border-color:var(--acc);color:#16130d;font-weight:600}
button:disabled{opacity:.5;cursor:default}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
a.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;color:inherit;text-decoration:none}
a.card:hover{border-color:var(--acc)}a.card b{display:block;margin-bottom:4px}a.card span{color:var(--mut);font-size:14px}
h2{font-size:13px;font-weight:600;color:var(--mut);margin:28px 0 10px;text-transform:uppercase;letter-spacing:.06em}
.box{max-width:380px;margin:8vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px}
.box h1{margin-bottom:4px}.box p{color:var(--mut);font-size:14px;margin:0 0 18px}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
input{width:100%;font:inherit;color:var(--tx);background:#141417;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
input:focus{outline:none;border-color:var(--acc)}
.row{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}.row button{flex:1}
.msg{min-height:20px;font-size:13px;margin-top:12px;color:var(--err)}.msg.ok{color:#8fc38a}
.brand{display:flex;justify-content:center;margin-bottom:18px}.brand img{height:52px}
dialog{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:14px;padding:22px;width:min(560px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.6)}dialog h3{margin:0 0 6px;font-size:17px}
.ed{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;margin-top:8px}.ed input{padding:7px 9px;font-size:14px}
.ed .d{grid-column:1/3}.hint{color:var(--mut);font-size:12px;margin-top:6px}
[hidden]{display:none!important}
</style></head><body><main>

<section id="vLogin" hidden>
  <div class="box">
    <div class="brand"><img src="library/brand/heights-logo-white.png" alt="Heights Contracting"></div>
    <h1>Heights Design</h1><p>Sign in to see all projects.</p>
    <form id="fLogin" autocomplete="on">
      <label for="u">Username</label><input id="u" name="username" autocomplete="username" required>
      <label for="p">Password</label><input id="p" name="password" type="password" autocomplete="current-password" required>
      <div class="row"><button class="pri" type="submit" id="bLogin">Sign in</button></div>
      <div class="msg" id="mLogin" role="alert"></div>
    </form>
  </div>
</section>

<section id="vHome" hidden>
  <header><img src="library/brand/heights-logo-white.png" alt="Heights Contracting"><div><h1>Heights Design</h1><p class="sub">3D visualisation projects</p></div>
    <div class="tools"><button id="bManage" type="button">Manage projects</button><button id="bCred" type="button">Change login</button><button id="bOut" type="button">Log out</button></div></header>
  <div class="grid" id="projects"></div>
  <h2>Resources</h2>
  <div class="grid"><a class="card" href="library/"><b>Material library</b><span>Surfaces and skies shared by all projects</span></a></div>
</section>

<dialog id="dCred"><form id="fCred" method="dialog">
  <h3>Change username and password</h3>
  <label for="cu">Current username</label><input id="cu" autocomplete="username" required>
  <label for="cp">Current password</label><input id="cp" type="password" autocomplete="current-password" required>
  <label for="nu">New username</label><input id="nu" autocomplete="off" required>
  <label for="np">New password (8+ characters)</label><input id="np" type="password" autocomplete="new-password" minlength="8" required>
  <label for="np2">Repeat new password</label><input id="np2" type="password" autocomplete="new-password" minlength="8" required>
  <div class="row"><button type="button" id="cCancel">Cancel</button><button class="pri" type="submit" id="cSave">Save</button></div>
  <div class="msg" id="mCred" role="alert"></div>
</form></dialog>

<dialog id="dProj"><div>
  <h3>Manage projects</h3><div class="hint">Link = folder in the Design repo, e.g. <code>my-project/</code></div>
  <div id="edList"></div>
  <div class="row"><button type="button" id="pAdd">+ Add project</button></div>
  <div class="row"><button type="button" id="pCancel">Cancel</button><button class="pri" type="button" id="pSave">Save</button></div>
  <div class="msg" id="mProj" role="alert"></div>
</div></dialog>

</main>
<script src="config.js"></script>
<script>
(function(){
  'use strict';
  var API=window.HC_AUTH_URL||'',KEY='hcDesignToken';
  function $(id){return document.getElementById(id);}
  function store(k,v){try{if(v===undefined)return sessionStorage.getItem(k);if(v===null)sessionStorage.removeItem(k);else sessionStorage.setItem(k,v);}catch(e){return null;}}
  var token=store(KEY)||'',projects=[];
  function call(body){
    if(!API)return Promise.reject(new Error('The login service is not connected yet (see admin/apps-script/SETUP.md).'));
    return fetch(API,{method:'POST',body:JSON.stringify(body)}).then(function(r){return r.json();}).then(function(d){if(!d.ok)throw new Error(d.error||'Request failed');return d;});
  }
  function show(v){$('vLogin').hidden=v!=='login';$('vHome').hidden=v!=='home';}
  function card(p){var a=document.createElement('a');a.className='card';a.href=p.url;var b=document.createElement('b');b.textContent=p.title;var s=document.createElement('span');s.textContent=p.description||'';a.appendChild(b);a.appendChild(s);return a;}
  function render(){var g=$('projects');g.innerHTML='';projects.forEach(function(p){g.appendChild(card(p));});if(!projects.length)g.textContent='No projects yet.';}
  function home(d){token=d.token||token;store(KEY,token);projects=d.projects||[];render();show('home');}
  function logout(msg){token='';store(KEY,null);show('login');$('mLogin').textContent=msg||'';$('u').focus();}

  $('fLogin').addEventListener('submit',function(e){e.preventDefault();var b=$('bLogin');b.disabled=true;$('mLogin').textContent='';
    call({action:'login',user:$('u').value.trim(),password:$('p').value}).then(function(d){$('p').value='';home(d);})
    .catch(function(err){$('mLogin').textContent=err.message;}).then(function(){b.disabled=false;});});
  $('bOut').addEventListener('click',function(){logout('');});

  // change credentials
  $('bCred').addEventListener('click',function(){$('fCred').reset();$('mCred').textContent='';$('dCred').showModal();});
  $('cCancel').addEventListener('click',function(){$('dCred').close();});
  $('fCred').addEventListener('submit',function(e){e.preventDefault();var m=$('mCred');m.className='msg';
    if($('np').value!==$('np2').value){m.textContent='The new passwords do not match';return;}
    $('cSave').disabled=true;
    call({action:'changeCredentials',user:$('cu').value.trim(),password:$('cp').value,newUser:$('nu').value.trim(),newPassword:$('np').value})
    .then(function(d){token=d.token;store(KEY,token);m.className='msg ok';m.textContent='Saved. Use the new login from now on.';setTimeout(function(){$('dCred').close();},1400);})
    .catch(function(err){m.textContent=err.message;}).then(function(){$('cSave').disabled=false;});});

  // manage projects
  function edRow(p){var r=document.createElement('div');r.className='ed';
    r.innerHTML='<input placeholder="Title"><input placeholder="Link, e.g. my-project/"><button type="button" title="Remove">✕</button><input class="d" placeholder="Short description">';
    var i=r.querySelectorAll('input');i[0].value=p.title||'';i[1].value=p.url||'';i[2].value=p.description||'';
    r.querySelector('button').onclick=function(){r.remove();};$('edList').appendChild(r);}
  $('bManage').addEventListener('click',function(){$('edList').innerHTML='';projects.forEach(edRow);$('mProj').textContent='';$('dProj').showModal();});
  $('pAdd').addEventListener('click',function(){edRow({});});
  $('pCancel').addEventListener('click',function(){$('dProj').close();});
  $('pSave').addEventListener('click',function(){var list=[].map.call($('edList').children,function(r){var i=r.querySelectorAll('input');return {title:i[0].value.trim(),url:i[1].value.trim(),description:i[2].value.trim()};}).filter(function(p){return p.title&&p.url;});
    $('pSave').disabled=true;call({action:'saveProjects',token:token,projects:list}).then(function(d){projects=d.projects;render();$('dProj').close();})
    .catch(function(err){$('mProj').textContent=err.message;if(/log in/i.test(err.message)){$('dProj').close();logout(err.message);}}).then(function(){$('pSave').disabled=false;});});

  // start: reuse a valid session token, otherwise ask to sign in
  if(token){call({action:'projects',token:token}).then(home).catch(function(err){logout(/log in/i.test(err.message)?'':err.message);});}
  else{logout(API?'':'The login service is not connected yet.');}
})();
</script>
</body></html>
